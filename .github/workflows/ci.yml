name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  # ---------------------------------------------------------------------------
  # CMake — Linux
  # ---------------------------------------------------------------------------
  cmake-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-minimal
    steps:
      - uses: actions/checkout@v4
      - name: Setup vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/${{ matrix.preset }}/vcpkg_installed
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ matrix.preset }}-
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build autoconf autoconf-archive automake libtool pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        if: matrix.preset != 'linux-minimal'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 60

  # ---------------------------------------------------------------------------
  # Xmake — Linux smoke (debug build only)
  # ---------------------------------------------------------------------------
  xmake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Configure
        run: xmake f -m debug -y
      - name: Build
        run: xmake
      - name: Smoke test
        run: xmake run using_tool_registry