name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  # ---------------------------------------------------------------------------
  # CMake — Linux
  # ---------------------------------------------------------------------------
  cmake-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-debug
          - linux-minimal
          - linux-all-features
          - linux-asan
          - linux-tsan
          - linux-ubsan
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-vcpkg@latest
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 60

  # ---------------------------------------------------------------------------
  # Xmake — Linux smoke
  # ---------------------------------------------------------------------------
  xmake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Configure
        run: xmake f -m debug -y
      - name: Build
        run: xmake
      - name: Smoke test — using_tool_registry
        run: xmake run using_tool_registry
      - name: Build release
        run: xmake f -m release -y && xmake