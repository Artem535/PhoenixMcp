name: Linux Xmake Smoke
on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  xmake-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/action-setup-xmake@v1
        with:
          xmake-version: dev
      - run: xmake configure
      - run: xmake build
      - run: xmake run using_tool_registry
